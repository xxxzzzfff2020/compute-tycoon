<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" role="img" aria-labelledby="title desc">
  <title id="title">算力服务器机柜阵列</title>
  <desc id="desc">深色机柜、青色运行灯与金色数据脉冲组成的服务器阵列</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071426"/>
      <stop offset="1" stop-color="#102a46"/>
    </linearGradient>
    <linearGradient id="rack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d3959"/>
      <stop offset="1" stop-color="#0a172a"/>
    </linearGradient>
    <linearGradient id="pulse" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset=".5" stop-color="#67e8f9"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="640" height="320" rx="28" fill="url(#bg)"/>
  <g opacity=".18" stroke="#38bdf8">
    <path d="M0 64h640M0 128h640M0 192h640M0 256h640"/>
    <path d="M80 0v320M160 0v320M240 0v320M320 0v320M400 0v320M480 0v320M560 0v320"/>
  </g>
  <!-- 两组机柜的内容宽 568；在 640 画布内左右各留 36，避免整体视觉偏右。 -->
  <g transform="translate(36 36)">
    <rect x="0" y="0" width="224" height="248" rx="16" fill="url(#rack)" stroke="#38bdf8" stroke-width="3"/>
    <rect x="344" y="0" width="224" height="248" rx="16" fill="url(#rack)" stroke="#fbbf24" stroke-width="3"/>
    <g fill="#142b48" stroke="#315273" stroke-width="2">
      <rect x="20" y="22" width="184" height="22" rx="6"/><rect x="20" y="52" width="184" height="22" rx="6"/>
      <rect x="20" y="82" width="184" height="22" rx="6"/><rect x="20" y="112" width="184" height="22" rx="6"/>
      <rect x="20" y="142" width="184" height="22" rx="6"/><rect x="20" y="172" width="184" height="22" rx="6"/>
      <rect x="20" y="202" width="184" height="22" rx="6"/>
      <rect x="364" y="22" width="184" height="22" rx="6"/><rect x="364" y="52" width="184" height="22" rx="6"/>
      <rect x="364" y="82" width="184" height="22" rx="6"/><rect x="364" y="112" width="184" height="22" rx="6"/>
      <rect x="364" y="142" width="184" height="22" rx="6"/><rect x="364" y="172" width="184" height="22" rx="6"/>
      <rect x="364" y="202" width="184" height="22" rx="6"/>
    </g>
    <g fill="#5eead4">
      <circle cx="38" cy="33" r="4"/><circle cx="38" cy="63" r="4"/><circle cx="38" cy="93" r="4"/>
      <circle cx="38" cy="123" r="4"/><circle cx="38" cy="153" r="4"/><circle cx="38" cy="183" r="4"/><circle cx="38" cy="213" r="4"/>
      <circle cx="382" cy="33" r="4"/><circle cx="382" cy="63" r="4"/><circle cx="382" cy="93" r="4"/>
      <circle cx="382" cy="123" r="4"/><circle cx="382" cy="153" r="4"/><circle cx="382" cy="183" r="4"/><circle cx="382" cy="213" r="4"/>
    </g>
    <path d="M224 124h120" stroke="url(#pulse)" stroke-width="10" stroke-linecap="round"/>
    <circle cx="284" cy="124" r="18" fill="#0b1f35" stroke="#67e8f9" stroke-width="3"/>
    <path d="M276 124h16m-8-8v16" stroke="#fbbf24" stroke-width="4" stroke-linecap="round"/>
  </g>
</svg>
