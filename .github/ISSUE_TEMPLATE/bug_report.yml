name: Bug report
description: Report a bug in Compute Tycoon
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Describe the bug and the expected behavior.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start a new save
        2. ...
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Browser / device
      placeholder: "e.g. Chrome 126 on iPhone 15"
    validations:
      required: true
