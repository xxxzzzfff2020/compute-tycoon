<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="./common.css" />
    <style>
      .art::before { filter: blur(30px) brightness(.40) saturate(1.05); }
      .keyart {
        background-size: auto 124%;
        background-position: 56% center;
        background-repeat: no-repeat;
        opacity: .96;
        -webkit-mask-image: linear-gradient(90deg, transparent 18%, #000 38%, #000 76%, transparent 96%);
        mask-image: linear-gradient(90deg, transparent 18%, #000 38%, #000 76%, transparent 96%);
      }
      .veil {
        background:
          linear-gradient(90deg, rgba(5, 9, 24, .88) 0%, rgba(5, 9, 24, .64) 21%, rgba(5, 9, 24, .06) 45%, rgba(5, 9, 24, .22) 70%, rgba(5, 9, 24, .86) 100%),
          linear-gradient(0deg, rgba(5, 9, 24, .74), transparent 48%);
      }
    </style>
  </head>
  <body>
    <main class="art">
      <div class="keyart"></div>
      <div class="veil"></div>
      <div class="orbit-lines"></div>
    </main>
  </body>
</html>
