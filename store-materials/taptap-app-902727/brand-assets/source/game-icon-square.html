<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      * { box-sizing: border-box; }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #070b1b;
      }

      .icon {
        position: relative;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        isolation: isolate;
        background:
          radial-gradient(circle at 50% 49%, rgba(255, 190, 73, .20) 0 23%, transparent 51%),
          linear-gradient(145deg, #16103e 0%, #070b1b 48%, #0c1640 100%);
      }

      .icon::before {
        content: "";
        position: absolute;
        inset: -10%;
        z-index: -3;
        background: url("../../../../public/assets/visuals/dyson-compute-sphere-keyart-v1.jpg") center / cover no-repeat;
        filter: blur(34px) brightness(.62) saturate(1.34);
        transform: scale(1.12);
      }

      .keyart {
        position: absolute;
        inset: 0;
        z-index: -2;
        background: url("../../../../public/assets/visuals/dyson-compute-sphere-keyart-v1.jpg") 50% 50% / auto 100% no-repeat;
        filter: saturate(1.18) contrast(1.05) brightness(1.05);
        transform: scale(1.20);
      }

      .focus {
        position: absolute;
        inset: 0;
        z-index: -1;
        background:
          radial-gradient(circle at 50% 49%, transparent 0 29%, rgba(8, 11, 29, .06) 39%, rgba(6, 8, 24, .56) 76%, rgba(5, 7, 20, .86) 100%),
          linear-gradient(180deg, rgba(15, 10, 48, .16), transparent 35% 68%, rgba(4, 8, 24, .40));
      }

      .orbit {
        position: absolute;
        left: 50%;
        top: 49%;
        width: 84%;
        aspect-ratio: 1;
        border: 3px solid rgba(255, 208, 100, .42);
        border-left-color: rgba(137, 118, 255, .26);
        border-radius: 50%;
        box-shadow:
          0 0 22px rgba(255, 181, 62, .28),
          inset 0 0 24px rgba(255, 203, 94, .10);
        transform: translate(-50%, -50%) rotate(-16deg) scaleY(.72);
        opacity: .82;
      }

      .orbit::before,
      .orbit::after {
        content: "";
        position: absolute;
        left: 50%;
        top: 50%;
        border-radius: 50%;
        transform: translate(-50%, -50%);
      }

      .orbit::before {
        width: 72%;
        height: 72%;
        border: 2px solid rgba(255, 235, 164, .28);
        box-shadow: 0 0 18px rgba(255, 196, 78, .18);
      }

      .orbit::after {
        width: 12px;
        height: 12px;
        margin-left: 41%;
        background: #fff2b0;
        box-shadow:
          0 0 10px #fff1a4,
          0 0 26px #ffb83d,
          0 0 52px rgba(255, 166, 45, .95);
      }

      .edge {
        position: absolute;
        inset: 0;
        border: 18px solid rgba(255, 216, 123, .10);
        box-shadow:
          inset 0 0 56px rgba(118, 82, 255, .26),
          inset 0 0 140px rgba(2, 5, 17, .52);
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <main class="icon" aria-label="算力大亨方形游戏图标">
      <div class="keyart"></div>
      <div class="focus"></div>
      <div class="orbit"></div>
      <div class="edge"></div>
    </main>
  </body>
</html>
